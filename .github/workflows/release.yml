name: Release

# Push a tag like v1.0.0 to build the exe and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload the exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Test and publish
        shell: pwsh
        run: ./publish.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/AIUsageCounter.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AIUsageCounter.exe" | Out-File -Encoding ascii publish/AIUsageCounter.exe.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: gh release create "$env:TAG" publish/AIUsageCounter.exe publish/AIUsageCounter.exe.sha256 --title "$env:TAG" --generate-notes --repo "$env:GITHUB_REPOSITORY"
